# Netlify конфигурация за „Такси Империя" — статичен PWA без билд стъпка.
# Заглавията живеят в _headers, защото този файл се зачита и при ръчен
# drag-and-drop деплой, докато netlify.toml се чете само при Git деплой.

[build]
  publish = "."

# index.html съдържа ръчно форматиран вграден JS и CSS.
# Изрично изключваме следобработката, за да не ги пренаписва нищо.
[build.processing]
  skip_processing = true
