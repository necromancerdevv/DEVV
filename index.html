<title>Такси Империя</title>
<style>
  :root{
    --ink:#17203A;          /* нощно синьо на таблото */
    --ink2:#222C4C;
    --paper:#FDFBF4;        /* хартия на касовата бележка */
    --taxi:#FFC300;         /* жълто на такситата */
    --taxiD:#C89500;
    --meter:#1FA871;        /* печалба */
    --fare:#E0563F;         /* разход */
    --muted:#7C8399;
    --sky:#2E9BD6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--ink);color:var(--ink);
    font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-weight:700;display:flex;flex-direction:column;user-select:none;
    font-variant-numeric:tabular-nums;
  }
  #stage{position:relative;flex:1;min-height:0;touch-action:none}
  canvas{display:block;width:100%;height:100%}

  /* ---------- таксиметров апарат горе ---------- */
  #top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;
       align-items:center;gap:5px;pointer-events:none}
  #meter{display:flex;align-items:stretch;border-radius:13px;overflow:hidden;
    background:var(--ink);box-shadow:0 8px 20px rgba(12,18,40,.34)}
  #meter .checks{width:15px;
    background-image:
      linear-gradient(45deg,var(--taxi) 25%,transparent 25%,transparent 75%,var(--taxi) 75%),
      linear-gradient(45deg,var(--taxi) 25%,#fff 25%,#fff 75%,var(--taxi) 75%);
    background-size:15px 15px;background-position:0 0,7.5px 7.5px}
  #meter .val{display:flex;align-items:center;gap:6px;padding:7px 13px 7px 11px;color:#fff}
  #meter .val + .val{border-left:1px solid rgba(255,255,255,.16)}
  #money{font-size:19px;letter-spacing:-.3px;font-weight:800;color:var(--taxi)}
  #gems{font-size:15px;font-weight:800;color:#8FD8F5}
  #meter svg{display:block}
  #net{font-size:12px;font-weight:700;color:#0E6B48;background:rgba(255,255,255,.86);
    padding:3px 11px;border-radius:9px;box-shadow:0 3px 9px rgba(20,28,55,.16)}
  #net.bad{color:#B23A28}
  #cityTag{position:absolute;top:88px;left:0;right:0;text-align:center;pointer-events:none;
    color:rgba(23,32,58,.34);font-size:17px;font-weight:800;letter-spacing:.6px}
  #clock{display:block;font-size:11.5px;font-weight:700;color:rgba(23,32,58,.4);letter-spacing:0}

  /* ---------- диспечерска бележка (мисия) ---------- */
  #quest{position:absolute;left:10px;top:118px;width:178px;background:var(--paper);
    border-radius:11px;padding:9px 10px 9px 16px;pointer-events:none;
    box-shadow:0 6px 16px rgba(12,18,40,.2);overflow:hidden}
  #quest:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background-image:
      linear-gradient(45deg,var(--taxi) 25%,transparent 25%,transparent 75%,var(--taxi) 75%),
      linear-gradient(45deg,var(--taxi) 25%,#fff 25%,#fff 75%,var(--taxi) 75%);
    background-size:7px 7px;background-position:0 0,3.5px 3.5px}
  #quest.done{background:#E7F7EC}
  #quest.done:before{background:var(--meter)}
  #qTxt{font-size:12.5px;line-height:1.3;font-weight:800}
  #qBar{height:6px;border-radius:4px;background:#E6E3D8;margin:7px 0 4px;overflow:hidden}
  #qBar i{display:block;height:100%;background:var(--meter);width:0%;transition:width .25s}
  #qMeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
  #rush{position:absolute;top:118px;right:10px;background:var(--fare);color:#fff;
    border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:800;
    box-shadow:0 6px 14px rgba(190,60,40,.34);pointer-events:none}

  /* ---------- бутони върху картата ---------- */
  #zoom{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  .zb{width:40px;height:40px;border:0;border-radius:12px;background:var(--ink);color:#fff;
    font:inherit;font-size:20px;font-weight:800;box-shadow:0 4px 0 #0B1226}
  .zb:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1226}
  #menu{position:relative}
  #menu .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;
    background:var(--meter);color:#fff;font-size:10.5px;font-weight:800;line-height:18px;
    font-style:normal;padding:0 4px;box-shadow:0 2px 5px rgba(6,10,26,.5)}
  #turbo{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:13px;padding:10px 14px;
    background:var(--taxi);color:#3B2C00;font:inherit;font-size:13.5px;font-weight:800;
    box-shadow:0 4px 0 var(--taxiD)}
  #turbo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--taxiD)}
  #turbo.off{background:#39415F;color:#8C93AC;box-shadow:0 4px 0 #232B45}

  /* ---------- диспечерско табло долу ---------- */
  #fleets{background:var(--ink);padding:10px 10px 12px;display:flex;gap:9px;overflow-x:auto;
    border-top:3px solid var(--taxi);scrollbar-width:none}
  #fleets::-webkit-scrollbar{display:none}
  .card{flex:0 0 178px;background:var(--paper);border-radius:12px;padding:0 0 9px;
    box-shadow:0 5px 14px rgba(6,10,26,.4);overflow:hidden}
  .chead{display:flex;align-items:center;gap:7px;padding:8px 10px 7px;
    background:var(--fc,#fff);border-bottom:2px solid rgba(23,32,58,.12)}
  .chead .nm{font-size:13px;font-weight:800;color:#17203A;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:1}
  .chead .lvb{font-size:11px;font-weight:800;background:rgba(23,32,58,.86);color:#fff;
    padding:2px 7px;border-radius:7px;white-space:nowrap}
  .stars{font-size:10px;letter-spacing:1.5px;color:#D8D4C6;padding:6px 10px 0}
  .stars i{color:var(--sky);font-style:normal}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;padding:6px 10px 8px}
  .cell{display:flex;flex-direction:column;line-height:1.15}
  .cell small{font-size:10px;color:var(--muted);font-weight:700}
  .cell b{font-size:13px;font-weight:800}
  .cell.exp b{color:var(--fare)}
  .mrow{display:flex;align-items:baseline;gap:6px;padding:0 10px 7px}
  .mrow b{font-size:14px;font-weight:800;color:var(--meter)}
  .mrow small{font-size:10px;font-weight:700;color:var(--muted)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px}
  .btns + .btns{margin-top:6px}
  .btns button{border:0;border-radius:9px;padding:7px 4px;font:inherit;font-size:12px;
    font-weight:800;line-height:1.2}
  .btns button small{display:block;font-size:10.5px;font-weight:700;opacity:.8}
  .btns button:active{transform:translateY(2px);box-shadow:none!important}
  .up{background:var(--taxi);color:#3B2C00;box-shadow:0 3px 0 var(--taxiD)}
  .car{background:var(--sky);color:#04283C;box-shadow:0 3px 0 #1E6E9B}
  .sell{background:#F0E7D9;color:#6B5540;box-shadow:0 3px 0 #CFC2AE}
  .rest{background:#E6E3D8;color:#4A5068;box-shadow:0 3px 0 #C6C2B4}
  .rest.on{background:var(--meter);color:#04301F;box-shadow:0 3px 0 #157A50}
  .citycard{background:#20294A;color:#F2F0E6}
  .citycard .chead{background:#2C3760;border-bottom-color:rgba(255,255,255,.12)}
  .citycard .chead .nm{color:#FDFBF4}
  .citycard .lvb{background:var(--taxi);color:#3B2C00}
  .citycard .cell small{color:#9AA3C0}
  .citycard .cell b{color:#FDFBF4}
  /* заключен следващ град: само въпросителна, подробностите идват след отключване */
  .citycard .myst{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;padding:16px 12px 12px;cursor:pointer}
  .citycard .myst .q{font-size:44px;line-height:1;font-weight:800;color:var(--taxi);
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .citycard .myst .hint{font-size:11px;font-weight:700;color:#9AA3C0;text-align:center;
    line-height:1.35;white-space:pre-line}
  .citycard .myst .bar{width:100%;height:6px;border-radius:4px;background:#17203A;overflow:hidden}
  .citycard .myst .bar i{display:block;height:100%;background:var(--taxi);width:0%;transition:width .25s}
  .go{background:var(--taxi);color:#3B2C00;box-shadow:0 3px 0 var(--taxiD)}
  .go.cant{background:#39415F;color:#8C93AC;box-shadow:0 3px 0 #232B45}
  .btns button.cant{background:#E9E6DB;color:#AFAB9C;box-shadow:0 3px 0 #D3CFC2}

  /* ---------- диалог ---------- */
  #modal{position:fixed;inset:0;background:rgba(14,20,42,.62);display:flex;align-items:center;
    justify-content:center;padding:26px;z-index:9}
  #box{background:var(--paper);border-radius:16px;padding:0 0 18px;width:100%;max-width:296px;
    text-align:center;box-shadow:0 20px 44px rgba(8,12,30,.5);overflow:hidden}
  #box:before{content:"";display:block;height:9px;
    background-image:
      linear-gradient(45deg,var(--taxi) 25%,transparent 25%,transparent 75%,var(--taxi) 75%),
      linear-gradient(45deg,var(--taxi) 25%,#fff 25%,#fff 75%,var(--taxi) 75%);
    background-size:9px 9px;background-position:0 0,4.5px 4.5px}
  #box h2{margin:16px 18px 4px;font-size:19px;font-weight:800}
  #box p{margin:0 18px;font-size:14.5px;color:#5F657D;font-weight:700;line-height:1.5}
  #box .big{display:block;font-size:27px;color:var(--ink);margin:10px 0 2px;font-weight:800}
  #box button{margin:16px 18px 0;width:calc(100% - 36px);border:0;border-radius:11px;padding:12px;
    background:var(--taxi);color:#3B2C00;font:inherit;font-size:15px;font-weight:800;
    box-shadow:0 4px 0 var(--taxiD)}
  #box button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--taxiD)}
  #box #mC{background:#E6E3D8;color:#4A5068;box-shadow:0 4px 0 #C6C2B4;margin-top:8px}
  #box button[disabled]{opacity:.6}
  /* ---------- общ панел с раздели ---------- */
  #panel{position:fixed;inset:0;background:rgba(14,20,42,.72);z-index:8;
    display:flex;align-items:flex-end;justify-content:center}
  #pbox{background:var(--paper);width:100%;max-width:420px;max-height:88vh;
    border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 -14px 40px rgba(8,12,30,.5)}
  #pbox:before{content:"";display:block;height:8px;flex:0 0 auto;
    background-image:
      linear-gradient(45deg,var(--taxi) 25%,transparent 25%,transparent 75%,var(--taxi) 75%),
      linear-gradient(45deg,var(--taxi) 25%,#fff 25%,#fff 75%,var(--taxi) 75%);
    background-size:8px 8px;background-position:0 0,4px 4px}
  #ptabs{display:flex;gap:0;border-bottom:2px solid rgba(23,32,58,.12);flex:0 0 auto}
  #ptabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:800;
    color:var(--muted);padding:11px 2px 9px;border-bottom:3px solid transparent;
    white-space:nowrap;letter-spacing:-.2px}
  #ptabs button.on{color:var(--ink);border-bottom-color:var(--taxi)}
  #pbody{overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
  #pclose{flex:0 0 auto;border:0;border-radius:11px;margin:0 16px 16px;padding:12px;
    background:#E6E3D8;color:#4A5068;font:inherit;font-size:14.5px;font-weight:800;
    box-shadow:0 4px 0 #C6C2B4}
  #pclose:active{transform:translateY(3px);box-shadow:0 1px 0 #C6C2B4}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px solid rgba(23,32,58,.09)}
  .prow:last-child{border-bottom:0}
  .prow .lb{font-size:13.5px;font-weight:800;color:var(--ink)}
  .prow .lb small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
  .prow .vl{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap}
  .tgl{border:0;border-radius:20px;width:52px;height:30px;background:#D6D2C4;position:relative;
    flex:0 0 auto;transition:background .15s}
  .tgl:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.22);transition:transform .15s}
  .tgl.on{background:var(--meter)}
  .tgl.on:after{transform:translateX(22px)}
  .pbtn{border:0;border-radius:10px;padding:11px 12px;font:inherit;font-size:13.5px;font-weight:800;
    background:var(--taxi);color:#3B2C00;box-shadow:0 3px 0 var(--taxiD);width:100%}
  .pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--taxiD)}
  .pbtn.danger{background:#E8D5CE;color:#8A3A28;box-shadow:0 3px 0 #CBB0A6}
  .pbtn.cant{background:#E9E6DB;color:#AFAB9C;box-shadow:0 3px 0 #D3CFC2}
  .phead{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:14px 0 4px}
  .phead:first-child{margin-top:0}
  #ver{position:absolute;left:0;right:0;bottom:4px;text-align:center;pointer-events:none;
    font-size:10.5px;font-weight:700;color:rgba(23,32,58,.30);letter-spacing:.4px}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
/* Кеш на DOM възлите: update() се върти 60 пъти в секунда и не бива
   да обхожда документа наново за всяко число, което изписва. */
function $(id){return document.getElementById(id);}
var EL={money:$("money"),gems:$("gems"),clock:$("clock"),net:$("net"),turbo:$("turbo"),
  rush:$("rush"),quest:$("quest"),qTxt:$("qTxt"),qBar:$("qBar").firstChild,mdot:$("mdot"),
  qRew:$("qRew"),qTime:$("qTime"),cityTag:$("cityTag").firstChild};
function setTxt(el,v){if(el&&el._v!==v){el._v=v;el.textContent=v;}}
function setCls(el,v){if(el&&el._c!==v){el._c=v;el.className=v;}}
function setHid(el,v){if(el&&el._hid!==v){el._hid=v;el.classList.toggle("hidden",v);}}
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function pick(a){return a[(Math.random()*a.length)|0];}
function lerp(a,b,t){return a+(b-a)*t;}
function fmt(n){if(n<1000)return Math.round(n)+"";
  var s=["K","M","B","T","Qa"],i=-1;while(n>=1000&&i<s.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.round(n))+s[i];}
function money(n){return fmt(n)+"$";}
function hex2rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function mixHex(h1,h2,t){var a=hex2rgb(h1),b=hex2rgb(h2);
  return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgbs(c,f){f=f||1;return "rgb("+Math.min(255,c[0]*f|0)+","+Math.min(255,c[1]*f|0)+","+Math.min(255,c[2]*f|0)+")";}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ==================== ГРАД ==================== */
var CITIES=[
  { name:"Метрополи", w:1600, h:2600, gx:[120,200], gy:[125,210],
    hwV:1, hwH:1, rivers:1, npc:12, mult:1, upk:1, dens:0.13, tall:180,
    down:[[0.42,0.17]], portFrom:0.74,
    zones:[{n:"Център",f:0.42,c:0},{n:"Южен район",f:0.32,c:30000},{n:"Пристанище",f:0.26,c:400000}],
    price:0 },
  { name:"Стария бряг", w:2150, h:3400, gx:[110,180], gy:[112,190],
    hwV:2, hwH:1, rivers:2, npc:20, mult:4.5, upk:1.7, dens:0.10, tall:230,
    down:[[0.30,0.13],[0.64,0.44]], portFrom:0.78,
    zones:[{n:"Стария град",f:0.30,c:0},{n:"Крайбрежието",f:0.24,c:900000},
           {n:"Индустрията",f:0.24,c:6000000},{n:"Доковете",f:0.22,c:40000000}],
    price:500000 },
  { name:"Мегаполис", w:2700, h:4300, gx:[100,165], gy:[102,172],
    hwV:2, hwH:2, rivers:2, npc:28, mult:16, upk:2.6, dens:0.08, tall:300,
    down:[[0.24,0.11],[0.58,0.33],[0.40,0.68]], portFrom:0.84,
    zones:[{n:"Даунтаун",f:0.24,c:0},{n:"Мидтаун",f:0.20,c:20000000},
           {n:"Ъптаун",f:0.20,c:150000000},{n:"Хълмовете",f:0.18,c:900000000},
           {n:"Летището",f:0.18,c:6000000000}],
    price:15000000 }
];
var cityIdx=0, CITY=CITIES[0];
var WW=CITY.w,WH=CITY.h,ROADW=30,HWW=48;
var xs=[],ys=[],nodes=[],edges=[],blocks=[],river=[],trees=[],lamps=[],ponds=[],bridges=[];
var DOWNS=[];
function district(x,y){
  if(y>WH*CITY.portFrom) return "port";
  for(var i=0;i<DOWNS.length;i++)
    if(Math.hypot(x-DOWNS[i].x,y-DOWNS[i].y)<DOWNS[i].r) return "down";
  return "res";
}
var PAL={
  down:["#C9D6E8","#D5DFEC","#BCCADD","#DDE4EE","#C3CFE0"],
  res:["#F1E2CE","#E9D6BE","#F5EADD","#E4D8C6","#EFDCD2"],
  port:["#D8D4C8","#CBD2CB","#E0DACE","#C6C9C2"]
};
function genCity(){
  WW=CITY.w;WH=CITY.h;
  DOWNS=CITY.down.map(function(d){return {x:WW*d[0],y:WH*d[1],r:Math.min(WW,WH)*0.24};});
  xs=[];ys=[];nodes=[];edges=[];blocks=[];trees=[];lamps=[];ponds=[];bridges=[];
  var x=80;while(x<WW-90){xs.push(Math.round(x));x+=rnd(CITY.gx[0],CITY.gx[1]);}xs.push(WW-80);
  var y=80;while(y<WH-90){ys.push(Math.round(y));y+=rnd(CITY.gy[0],CITY.gy[1]);}ys.push(WH-80);
  river=[];
  for(var rv=0;rv<CITY.rivers;rv++){
    var base=0.62-rv*0.34, amp=150+rv*40;
    for(var t=0;t<=14;t++)river.push({x:WW*base+Math.sin(t*0.55+rv)*amp-t*7,y:WH*t/14,w:rnd(50,95),seg:rv});
  }

  var C=xs.length,R=ys.length,id={};
  for(var j=0;j<R;j++)for(var i=0;i<C;i++){id[i+"_"+j]=nodes.length;
    nodes.push({x:xs[i],y:ys[j],nb:[],hw:false});}
  function link(a,b,hw){
    if(a==null||b==null)return;
    var d=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
    var w=hw?d*0.55:d;
    nodes[a].nb.push({n:b,d:d,w:w});nodes[b].nb.push({n:a,d:d,w:w});
    edges.push({a:a,b:b,hw:!!hw,block:0});
    if(hw){nodes[a].hw=nodes[b].hw=true;}
  }
  // магистрала: една вертикална и една хоризонтална артерия
  var hwCols=[],hwRows=[];
  for(var q=0;q<CITY.hwV;q++) hwCols.push(Math.round(C*(q+1)/(CITY.hwV+1)));
  for(var q2=0;q2<CITY.hwH;q2++) hwRows.push(Math.round(R*(q2+1)/(CITY.hwH+1)));
  function inArr(a,v){for(var i=0;i<a.length;i++)if(a[i]===v)return true;return false;}
  for(var j2=0;j2<R;j2++)for(var i2=0;i2<C;i2++){
    if(i2<C-1){ var isHw=inArr(hwRows,j2);
      if(isHw||!(j2>0&&j2<R-1&&Math.random()<CITY.dens)) link(id[i2+"_"+j2],id[(i2+1)+"_"+j2],isHw); }
    if(j2<R-1){ var isHw2=inArr(hwCols,i2);
      if(isHw2||!(i2>0&&i2<C-1&&Math.random()<CITY.dens)) link(id[i2+"_"+j2],id[i2+"_"+(j2+1)],isHw2); }
  }
  var di=1,dj=1;while(di<C-1&&dj<R-1){link(id[di+"_"+dj],id[(di+1)+"_"+(dj+1)]);di++;dj++;}

  for(var jj=0;jj<R-1;jj++)for(var ii=0;ii<C-1;ii++){
    var bx=xs[ii]+ROADW/2+8,by=ys[jj]+ROADW/2+8;
    var bw=xs[ii+1]-xs[ii]-ROADW-16,bh=ys[jj+1]-ys[jj]-ROADW-16;
    if(bw<24||bh<24)continue;
    var cx=bx+bw/2,cy=by+bh/2;
    if(inRiver(cx,cy,8))continue;
    var dist=district(cx,cy);
    var park=Math.random()<(dist==="res"?0.22:dist==="down"?0.08:0.10);
    if(park){ blocks.push(mkPark(bx,by,bw,bh)); continue; }
    var n=(dist==="port")?1:(bw>110&&bh>110?ri(2,3):ri(1,2));
    if(n===1||bw<95||bh<95) blocks.push(mk(bx,by,bw,bh,dist));
    else{
      var vert=bw>bh,g=6;
      for(var p=0;p<n;p++){
        if(vert){var w2=(bw-(n-1)*g)/n;blocks.push(mk(bx+p*(w2+g),by,w2,bh,dist));}
        else{var h2=(bh-(n-1)*g)/n;blocks.push(mk(bx,by+p*(h2+g),bw,h2,dist));}
      }
    }
  }
  // забележителности
  // махаме кварталите, през които минава улица (диагонал, магистрала)
  blocks=blocks.filter(function(b){
    for(var e=0;e<edges.length;e++){
      var E=edges[e],a=nodes[E.a],c=nodes[E.b];
      var m=E.hw?10:2;
      if(segRect(a.x,a.y,c.x,c.y,b.x-m,b.y-m,b.w+2*m,b.h+2*m))return false;
    }
    return true;
  });
  blocks.forEach(function(b){ if(b.park) fillPark(b); });
  var stad=blocks.filter(function(b){return b.park&&b.w>150&&b.h>130;})[0];
  if(stad){stad.park=false;stad.stadium=true;stad.hgt=52;stad.c=hex2rgb("#DDD9CE");}
  // мостове
  edges.forEach(function(e){
    var a=nodes[e.a],b=nodes[e.b],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(inRiver(mx,my,0)) {e.bridge=true;bridges.push(e);}
  });
  nodes.forEach(function(n,i){
    n.id=i; n.ok=n.nb.length>0;
    n.light=(n.nb.length>=3&&!n.hw)?Math.random()*LCYC:-1;
    if(n.ok&&Math.random()<0.8) lamps.push({x:n.x+rnd(-16,16),y:n.y+rnd(-16,16),r:rnd(95,145)});
  });
  makeDepot();
  makeWash();
}
/* ---- автомивка ---- */
var wash=null;
function makeWash(){
  wash=null;
  var tx=WW*0.62,ty=WH*0.30,bi=-1,bd=1e9;
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    if(b.stadium||b.lot||b.w<60||b.h<55)continue;
    var d=Math.hypot(b.x+b.w/2-tx,b.y+b.h/2-ty);
    if(d<bd){bd=d;bi=i;}
  }
  if(bi<0)return;
  var lot=blocks[bi];lot.park=false;lot.wash=true;lot.hgt=26;
  var nd=0,nbd=1e9;
  for(var k=0;k<nodes.length;k++){
    if(!nodes[k].ok)continue;
    var dd=Math.hypot(nodes[k].x-(lot.x+lot.w/2),nodes[k].y-(lot.y+lot.h/2));
    if(dd<nbd){nbd=dd;nd=k;}
  }
  var bays=[],n=Math.max(2,Math.min(4,Math.floor(lot.w/34)));
  for(var c=0;c<n;c++)bays.push({x:lot.x+lot.w*(c+0.5)/n,y:lot.y+lot.h*0.62,taken:null});
  wash={node:nd,lot:lot,x:lot.x+lot.w/2,y:lot.y+lot.h/2,bays:bays};
}
function freeBay(car){
  if(!wash)return null;
  for(var i=0;i<wash.bays.length;i++)if(!wash.bays[i].taken){wash.bays[i].taken=car;return wash.bays[i];}
  return null;
}
function releaseBay(car){
  if(!wash)return;
  for(var i=0;i<wash.bays.length;i++)if(wash.bays[i].taken===car)wash.bays[i].taken=null;
}
function washFee(f){return Math.round(26*f.tier*(1+0.12*(f.lvl-1)));}
function sendToWash(c){
  if(!wash)return false;
  var p=route(c.path[c.seg]||c.path[0],wash.node);
  if(!p)return false;
  releaseSlot(c);
  if(c.client){c.client.taken=false;c.client=null;}
  c.path=p;c.seg=0;c.t=0;c.state="toWash";
  return true;
}
/* ---- паркинг (гараж) ---- */
var depot=null;
function makeDepot(){
  depot=null;
  var tx=WW*0.34,ty=WH*0.22,bi=-1,bd=1e9;
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i];
    if(b.stadium||b.w<70||b.h<60)continue;
    var d=Math.hypot(b.x+b.w/2-tx,b.y+b.h/2-ty);
    if(d<bd){bd=d;bi=i;}
  }
  if(bi<0)return;
  var lot=blocks[bi];lot.park=false;lot.lot=true;lot.hgt=0;
  var nd=0,nbd=1e9;
  for(var k=0;k<nodes.length;k++){
    if(!nodes[k].ok)continue;
    var dd=Math.hypot(nodes[k].x-(lot.x+lot.w/2),nodes[k].y-(lot.y+lot.h/2));
    if(dd<nbd){nbd=dd;nd=k;}
  }
  var slots=[],cols=Math.max(2,Math.floor((lot.w-14)/26)),rows=Math.max(2,Math.floor((lot.h-16)/34));
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    if(slots.length>=40)break;
    slots.push({x:lot.x+10+c*26+11,y:lot.y+10+r*34+15,a:Math.PI/2,taken:null});
  }
  depot={node:nd,lot:lot,x:lot.x+lot.w/2,y:lot.y+lot.h/2,slots:slots};
}
function freeSlot(car){
  if(!depot)return null;
  for(var i=0;i<depot.slots.length;i++)if(!depot.slots[i].taken){depot.slots[i].taken=car;return depot.slots[i];}
  return null;
}
function releaseSlot(car){
  if(!depot)return;
  for(var i=0;i<depot.slots.length;i++)if(depot.slots[i].taken===car)depot.slots[i].taken=null;
}
/* ---- светофари ---- */
var LCYC=13,tsim=0;
function lightGreen(node,ns){
  if(node.light<0)return true;
  var t=(tsim+node.light)%LCYC;
  return ns ? (t<6) : (t>6.6&&t<12.6);
}
function mk(x,y,w,h,dist){
  var hg = dist==="down" ? rnd(80,150)+Math.random()*Math.random()*180
         : dist==="port" ? rnd(26,58)
         : rnd(24,56)+Math.random()*Math.random()*70;
  var lit=[];for(var i=0;i<6;i++)lit.push(Math.random()<0.55);
  return {x:x,y:y,w:w,h:h,park:false,dist:dist,c:hex2rgb(pick(PAL[dist])),
    hgt:Math.round(hg),pitched:dist!=="down"&&hg<70&&Math.random()<0.6,
    roof:Math.random()<0.5,ac:Math.random()<0.45,heli:dist==="down"&&hg>210,lit:lit,
    awn:dist!=="port"&&Math.random()<0.35,awnC:pick(["#E4573D","#4FB3F6","#57C97C","#FFC93C"])};
}
function mkPark(x,y,w,h){
  return {x:x,y:y,w:w,h:h,park:true,hgt:0,c:hex2rgb("#C2E3B0")};
}
function fillPark(b){
  for(var k=0;k<3+((b.w*b.h)/8000|0);k++) trees.push({x:b.x+rnd(12,b.w-12),y:b.y+rnd(12,b.h-12),r:rnd(9,16),c:pick(["#5FA653","#6DB562","#4F9448","#79C06B"])});
  if(b.w>90&&b.h>90&&Math.random()<0.5) ponds.push({x:b.x+b.w*0.3,y:b.y+b.h*0.35,w:b.w*0.42,h:b.h*0.34});
}
function segRect(x1,y1,x2,y2,rx,ry,rw,rh){
  var t0=0,t1=1,dx=x2-x1,dy=y2-y1;
  var p=[-dx,dx,-dy,dy],q=[x1-rx,rx+rw-x1,y1-ry,ry+rh-y1];
  for(var i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; }
    else{ var r=q[i]/p[i];
      if(p[i]<0){ if(r>t1) return false; if(r>t0) t0=r; }
      else{ if(r<t0) return false; if(r<t1) t1=r; } }
  }
  return true;
}
function inRiver(x,y,pad){
  for(var t=0;t<river.length-1;t++){var a=river[t],b=river[t+1];
    if(y<a.y-30||y>b.y+30)continue;
    var k=(y-a.y)/((b.y-a.y)||1),cx=a.x+(b.x-a.x)*k,w=a.w+(b.w-a.w)*k;
    if(Math.abs(x-cx)<w+(pad||0))return true;}
  return false;
}
/* ==================== зони ==================== */
var ZONES=[];
function buildZones(keep){
  var acc=0,old=keep||[];
  ZONES=CITY.zones.map(function(z,i){
    var o={y:WH*acc,h:WH*z.f,cost:z.c,open:i===0||!!old[i],name:z.n};
    acc+=z.f;return o;
  });
}
function zoneOf(y){for(var i=0;i<ZONES.length;i++)if(y>=ZONES[i].y&&y<ZONES[i].y+ZONES[i].h)return i;return 0;}
function nodeOpen(n){return ZONES[zoneOf(nodes[n].y)].open&&nodes[n].ok;}
function randomOpenNode(){for(var t=0;t<300;t++){var n=ri(0,nodes.length-1);if(nodeOpen(n))return n;}return 0;}
/* ==================== маршрут ==================== */
var blocked={};
function key(a,b){return a<b?a+"_"+b:b+"_"+a;}
function route(a,b){
  if(a===b)return[a];
  var dist=new Float64Array(nodes.length).fill(1e18),prev=new Int32Array(nodes.length).fill(-1);
  var vis=new Uint8Array(nodes.length),q=[a];dist[a]=0;
  while(q.length){
    var bi=0;for(var i=1;i<q.length;i++)if(dist[q[i]]<dist[q[bi]])bi=i;
    var u=q.splice(bi,1)[0];if(vis[u])continue;vis[u]=1;if(u===b)break;
    for(var k=0;k<nodes[u].nb.length;k++){var e=nodes[u].nb[k];
      if(vis[e.n]||blocked[key(u,e.n)])continue;
      var nd=dist[u]+e.w;if(nd<dist[e.n]){dist[e.n]=nd;prev[e.n]=u;q.push(e.n);}}
  }
  if(b!==a&&prev[b]<0)return null;
  var p=[b],c=b;while(prev[c]>=0){c=prev[c];p.push(c);}return p.reverse();
}
function pathLen(p){var d=0;for(var i=0;i<p.length-1;i++)d+=Math.hypot(nodes[p[i]].x-nodes[p[i+1]].x,nodes[p[i]].y-nodes[p[i+1]].y);return d;}
function isHwEdge(a,b){
  for(var i=0;i<nodes[a].nb.length;i++) if(nodes[a].nb[i].n===b) return nodes[a].nb[i].w<nodes[a].nb[i].d;
  return false;
}

/* Умножаващият слой: линейните надграждания сами по себе си не догонват
   експоненциалните цени, затова праговете дават скокове. */
var CARMILE=[4,8,14],TOTMILE=[10,20,35,55];
function fleetMult(f){var m=1;for(var i=0;i<CARMILE.length;i++)if(f.cars>=CARMILE[i])m*=2;return m;}
function nextMile(f){for(var i=0;i<CARMILE.length;i++)if(f.cars<CARMILE[i])return CARMILE[i];return 0;}
function globalMult(){var t=totalCars(),m=1;for(var i=0;i<TOTMILE.length;i++)if(t>=TOTMILE[i])m*=1.5;return m;}
function perKm(f){return 4.2*f.tier*CITY.mult*(1+0.40*(f.lvl-1))*fleetMult(f)*globalMult()
  *presMult()*achMult()*gemMult()*(Date.now()<x2Until?2:1);}
function upCost(f){return Math.round(190*f.tier*Math.pow(1.31,f.lvl-1));}
function carCost(f){return Math.round(340*f.tier*Math.pow(1.75,f.cars-1));}
// издръжката расте с бонуса, но по-бавно от него — иначе разходите заглъхват
function carUpkeep(f){return 0.26*f.tier*CITY.upk*(1+0.16*(f.lvl-1))*Math.pow(fleetMult(f),0.6);}
function sellPrice(f){return Math.round(340*f.tier*Math.pow(1.75,Math.max(0,f.cars-2))*0.55);}
function expenseRate(){
  var s=0;
  for(var i=0;i<cars.length;i++){
    var f=fleets[cars[i].f];if(!f)continue;
    s+=carUpkeep(f)*carUp(cars[i])*(cars[i].state==="parked"?0.25:1);
  }
  return s;
}
function totalCars(){var s=0;fleets.forEach(function(f){s+=f.cars;});return s;}
function avgFare(){var s=0;fleets.forEach(function(f){s+=perKm(f);});return (s/Math.max(1,fleets.length))*7;}

  else if(t==="spot"){q.spot=pick(SPOTS);q.goal=ri(2,3);q.time=115;q.txt=q.goal+" курса до "+SPOTBG[q.spot];}

  else if(t==="long"){q.dist=rnd(700,1000);q.goal=ri(1,2);q.time=100;q.txt=q.goal+" дълъг курс над "+Math.round(q.dist/70)+" км";}
  else if(t==="gems"){q.goal=ri(1,2);q.time=120;q.txt="Събери "+q.goal+" диамант(а) от картата";}
  else{q.goal=45;q.time=75;q.txt="45 сек без изпуснат клиент";}
  // наградата е 1.5-2.5 мин приход, не 6-9: трудните мисии плащат с диаманти

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var VW=0,VH=0,DPR=1;
var cam={x:WW/2,y:WH*0.14,s:1},camT={x:WW/2,y:WH*0.14,s:1},vel={x:0,y:0},minS=1,maxS=1;
var FOCAL=2000;
function resize(reseed){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var st=document.getElementById("stage");
  VW=st.clientWidth;VH=st.clientHeight;cv.width=VW*DPR;cv.height=VH*DPR;
  minS=VW/WW*0.95;maxS=minS*5;
  if(reseed){camT.s=Math.min(maxS,Math.max(camT.s,minS*2.2));cam.s=camT.s;}
  else{ // адресната лента на телефона праща resize постоянно — мащабът на играча остава
    camT.s=Math.max(minS,Math.min(maxS,camT.s));
    cam.s=Math.max(minS,Math.min(maxS,cam.s));}
  clampT();
}
function clampT(){
  camT.s=Math.max(minS,Math.min(maxS,camT.s));
  var hw=VW/2/camT.s,hh=VH/2/camT.s;
  camT.x=Math.max(Math.min(hw,WW/2),Math.min(Math.max(WW-hw,WW/2),camT.x));
  camT.y=Math.max(Math.min(hh,WH/2),Math.min(Math.max(WH-hh,WH/2),camT.y));
}
window.addEventListener("resize",function(){resize();});
function scr2world(sx,sy){var r=cv.getBoundingClientRect();
  return {x:(sx-r.left-VW/2)/cam.s+cam.x,y:(sy-r.top-VH/2)/cam.s+cam.y};}
function zoomAt(sx,sy,f){
  var r=cv.getBoundingClientRect(),px=sx-r.left-VW/2,py=sy-r.top-VH/2;
  var w={x:px/camT.s+camT.x,y:py/camT.s+camT.y};
  camT.s=Math.max(minS,Math.min(maxS,camT.s*f));
  camT.x=w.x-px/camT.s;camT.y=w.y-py/camT.s;clampT();
}

/* --- жестове: центроид на всички пръсти, без скокове при добавяне/махане --- */
var pts={},np=0,gest=null,tapInfo=null,lastTap=0,lastTapX=0,lastTapY=0;
function centroid(){
  var sx=0,sy=0,n=0,list=[];
  for(var k in pts){sx+=pts[k].x;sy+=pts[k].y;n++;list.push(pts[k]);}
  var d=0;
  if(n>=2){var a=list[0],b=list[1];d=Math.hypot(a.x-b.x,a.y-b.y);}
  return {x:sx/n,y:sy/n,d:d,n:n};
}
function resetGesture(){
  if(np===0){gest=null;return;}
  var c=centroid();
  gest={x:c.x,y:c.y,d:c.d,n:c.n,t:performance.now()};
}
cv.addEventListener("pointerdown",function(e){
  gestured=true;
  cv.setPointerCapture(e.pointerId);
  if(!pts[e.pointerId])np++;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  vel.x=vel.y=0;
  if(np===1) tapInfo={x:e.clientX,y:e.clientY,t:Date.now(),ok:true};
  else if(tapInfo) tapInfo.ok=false;
  resetGesture();
});
cv.addEventListener("pointermove",function(e){
  if(!pts[e.pointerId])return;
  pts[e.pointerId].x=e.clientX;pts[e.pointerId].y=e.clientY;
  if(!gest)return;
  var c=centroid(),now=performance.now();
  var dt=Math.min(0.1,Math.max(0.012,(now-gest.t)/1000));
  // мащаб около центроида
  if(c.n>=2&&gest.d>10&&c.d>10){
    var f=c.d/gest.d;
    var s2=Math.max(minS,Math.min(maxS,camT.s*f));
    f=s2/camT.s;
    var wx=(c.x-VW/2)/camT.s+camT.x, wy=(c.y-VH/2)/camT.s+camT.y;
    camT.s=s2;
    camT.x=wx-(c.x-VW/2)/camT.s;
    camT.y=wy-(c.y-VH/2)/camT.s;
  }
  // влачене по движението на центроида
  var dx=c.x-gest.x,dy=c.y-gest.y;
  camT.x-=dx/camT.s;camT.y-=dy/camT.s;
  clampT();
  cam.x=camT.x;cam.y=camT.y;cam.s=camT.s;      // без забавяне докато влачиш
  if(tapInfo&&(Math.abs(e.clientX-tapInfo.x)+Math.abs(e.clientY-tapInfo.y)>16))tapInfo.ok=false;
  vel.x=-dx/camT.s/dt*0.30;vel.y=-dy/camT.s/dt*0.30;
  vel.x=Math.max(-4000,Math.min(4000,vel.x));vel.y=Math.max(-4000,Math.min(4000,vel.y));
  gest={x:c.x,y:c.y,d:c.d,n:c.n,t:now};
});
function upEv(e){
  if(pts[e.pointerId]){delete pts[e.pointerId];np=Math.max(0,np-1);}
  if(np===0){
    if(tapInfo&&tapInfo.ok&&Date.now()-tapInfo.t<460){
      vel.x=vel.y=0;
      var now=Date.now();
      if(wakeTap(e.clientX,e.clientY)){lastTap=0;}
      else if(now-lastTap<320&&Math.abs(e.clientX-lastTapX)<50&&Math.abs(e.clientY-lastTapY)<50){
        zoomAt(e.clientX,e.clientY,camT.s<maxS*0.7?1.8:0.5);lastTap=0;
      }else{
        lastTap=now;lastTapX=e.clientX;lastTapY=e.clientY;
        tap(e.clientX,e.clientY);
      }
    }
    tapInfo=null;gest=null;
  }else resetGesture();   // остатъчните пръсти започват наново, без скок
}
cv.addEventListener("pointerup",upEv);cv.addEventListener("pointercancel",upEv);
cv.addEventListener("lostpointercapture",upEv);
cv.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.16:0.86);},{passive:false});

var shakeT=0;
var sleepArrows=[];
function wakeTap(sx,sy){
  var r=cv.getBoundingClientRect(),px=sx-r.left,py=sy-r.top;
  // стрелките в края на екрана
  for(var i=0;i<sleepArrows.length;i++){
    var A=sleepArrows[i];
    if(Math.hypot(A.px-px,A.py-py)<34&&A.car.asleep){
      camT.x=A.car.x;camT.y=A.car.y;clampT();
      wake(A.car,false);return true;
    }
  }
  var w=scr2world(sx,sy);
  var R=Math.max(46,52/cam.s);   // голяма цел, независимо от мащаба
  var best=null,bd=1e9;
  for(var k=0;k<cars.length;k++){
    if(!cars[k].asleep)continue;
    var d=Math.hypot(cars[k].x-w.x,cars[k].y-w.y);
    if(d<R&&d<bd){bd=d;best=cars[k];}
  }
  if(best){wake(best,false);return true;}
  return false;
}
function tap(sx,sy){
  var w=scr2world(sx,sy);
  for(var s=0;s<cars.length;s++)if(cars[s].asleep&&Math.hypot(cars[s].x-w.x,cars[s].y-w.y)<44){
    wake(cars[s],false);return;}
  for(var s2=0;s2<cars.length;s2++){
    var cc=cars[s2];
    if((cc.dirt||0)>0.2&&(cc.state==="idle"||cc.state==="pickup"||cc.state==="parked")
       &&Math.hypot(cc.x-w.x,cc.y-w.y)<40){
      if(sendToWash(cc)){say(cc.x,cc.y,"Отивам на мивка");return;}
    }
  }
  for(var i=0;i<crates.length;i++)if(Math.hypot(crates[i].x-w.x,crates[i].y-w.y)<70){
    S.gems++;ST.gemsF++;questProgress("gems",1);sfx("gem");vibro(15);
    burst(crates[i].x,crates[i].y,"#4FC3F7",10);say(crates[i].x,crates[i].y,"+1 💎");
    crates.splice(i,1);save();return;}
  for(var s3=0;s3<cars.length;s3++)
    if(Math.hypot(cars[s3].x-w.x,cars[s3].y-w.y)<40){
      say(cars[s3].x,cars[s3].y,drvName(cars[s3])+" · "+trait(cars[s3]).n);return;}
  for(var z=0;z<ZONES.length;z++){var Z=ZONES[z];if(Z.open)continue;
    if(w.y>=Z.y&&w.y<Z.y+Z.h){
      if(S.money>=Z.cost){S.money-=Z.cost;Z.open=true;save();
        popup("Нов район",Z.name+" е отключен — повече клиенти и по-дълги курсове.");}
      else shakeT=0.45;
      return;}}
}
/* ==================== логика ==================== */
var spawnT=0,saveT=0,crateT=25,eventT=100,cardT=0,hist=[],allV=[];
function update(dt){
  tsim+=dt;clock+=dt;night=nightFactor((clock/DAY)%1);
  var p=(clock/DAY)%1; dusk=Math.max(0,1-Math.abs(p-0.48)/0.09);
  /* --- разходи --- */
  var exp=expenseRate();
  S.money-=exp*dt;
  var broke=S.money<0; if(broke)S.money=0;
  var dayIdx=Math.floor(clock/DAY);
  if(dayIdx>lastDay){
    lastDay=dayIdx;
    var tax=Math.min(S.money*0.7,S.money*0.03+22*totalCars());
    S.money-=tax;
    popupSmall("Данъци и сметки −"+money(tax));
  }
  if(!evOn()&&npcs.length>CITY.npc) npcs.length=CITY.npc;
  if(np===0){
    camT.x+=vel.x*dt;camT.y+=vel.y*dt;
    var f=Math.pow(0.0016,dt);vel.x*=f;vel.y*=f;
    if(Math.abs(vel.x)<1)vel.x=0;if(Math.abs(vel.y)<1)vel.y=0;clampT();
  }
  var k=1-Math.pow(0.0008,dt);
  cam.x=lerp(cam.x,camT.x,k);cam.y=lerp(cam.y,camT.y,k);cam.s*=Math.pow(camT.s/cam.s,k);

  var evx=evOn(),rush=!!evx;
  spawnT-=dt;
  if(spawnT<=0){spawnClient();
    spawnT=Math.max(0.2,(1.6-0.1*fleets.length-0.15*ZONES.filter(function(z){return z.open;}).length)
      /(evx?(evx.k==="fest"?3:2.2):1));}
  crateT-=dt;
  if(crateT<=0){crateT=rnd(40,70);if(crates.length<3){var n=randomOpenNode();crates.push({x:nodes[n].x,y:nodes[n].y,t:45,sp:Math.random()*6});}}
  for(var i=crates.length-1;i>=0;i--){crates[i].t-=dt;crates[i].sp+=dt*2;if(crates[i].t<=0)crates.splice(i,1);}

  eventT-=dt;
  if(eventT<=0){ eventT=rnd(70,130); if(Math.random()<0.58)startEvent(); else makeAccident(); }
  for(var a=accidents.length-1;a>=0;a--){
    accidents[a].t-=dt;
    if(accidents[a].t<=0){ delete blocked[accidents[a].k]; accidents.splice(a,1); }
  }
  EL.rush.classList.toggle("hidden",!rush);
  if(evx){setTxt(EL.rush,evx.n);
    if(EL.rush._bg!==evx.c){EL.rush._bg=evx.c;EL.rush.style.background=evx.c;}}

  for(var c=clients.length-1;c>=0;c--){var cl=clients[c];cl.bob+=dt*3;
    if(!cl.taken){cl.wait+=dt;
      if(cl.wait>36){
        // изолиран от катастрофа клиент е недостижим по вина на картата, не на играча
        if((cl.unreach||0)<3){
          var fine=Math.min(S.money,avgFare()*0.25);S.money-=fine;
          if(quest&&quest.type==="nofail"&&!quest.finished)quest.p=0;
          parts.push({txt:"−"+money(fine),red:true,x:nodes[cl.from].x,y:nodes[cl.from].y,z:34,vx:0,vy:0,vz:30,r:0,vr:0,t:1.4});
        }
        clients.splice(c,1);
      }}}
  allV=cars.filter(function(c){return c.state!=="idle";}).concat(npcs);
  for(var q=0;q<cars.length;q++)drive(cars[q],dt,broke);
  for(var m=0;m<npcs.length;m++)driveNpc(npcs[m],dt);
  for(var pi=parts.length-1;pi>=0;pi--){var pt=parts[pi];
    pt.vz-=260*dt;pt.z+=pt.vz*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.r+=pt.vr*dt;pt.t-=dt;
    if(pt.z<0){pt.z=0;pt.vz*=-0.35;pt.vx*=0.6;pt.vy*=0.6;}
    if(pt.t<=0)parts.splice(pi,1);}
  for(var b=bubbles.length-1;b>=0;b--){bubbles[b].t-=dt;if(bubbles[b].t<=0)bubbles.splice(b,1);}
  if(shakeT>0)shakeT-=dt;

  if(quest){
    if(!quest.finished&&quest.type==="nofail")questProgress("nofail",dt);
    if(quest.finished){ questCool-=dt; if(questCool<=0){EL.quest.classList.remove("done");newQuest();} }
    else { quest.left-=dt; if(quest.left<=0) newQuest(); }
    renderQuest();
  }
  // по изкараното за живота, не по касата — иначе харченето блокира прогреса
  if(fleets.length<FLEETS.length&&S.best>=FLEETS[fleets.length].at){

var EVENTS=[

function makeAccident(){

  if(!e||e.hw&&Math.random()<0.7) return;
  var kk=key(e.a,e.b);
  if(blocked[kk])return;

  cars.forEach(function(c){
    // toWash/toDepot нямат клиент — целта им е мивката/гаража
    var to = c.state==="pickup"  ? (c.client && c.client.from)
           : c.state==="ride"    ? (c.client && c.client.to)
           : c.state==="toWash"  ? (wash && wash.node)
           : c.state==="toDepot" ? (depot && depot.node) : null;
    if(to==null)return;
    for(var i=c.seg;i<c.path.length-1;i++) if(key(c.path[i],c.path[i+1])===kk){
      var p=route(c.path[c.seg],to);

    }
  });

function trafficFactor(v){
  if(v.stuck>2.5)return 1;                    // разбиване на задънени ситуации
  var f=1,ca=Math.cos(v.a),sa=Math.sin(v.a);
  for(var i=0;i<allV.length;i++){
    var u=allV[i];if(u===v)continue;
    var dx=u.x-v.x,dy=u.y-v.y;
    if(dx>34||dx<-34||dy>34||dy<-34)continue;
    if(Math.cos(u.a-v.a)<0.5)continue;        // само коли в същата посока
    var d=Math.hypot(dx,dy);if(d>34)continue;
    var fwd=dx*ca+dy*sa,lat=-dx*sa+dy*ca;
    if(fwd<3||lat>9||lat<-9)continue;
    var q=(d-15)/19; if(q<0)q=0; if(q<f)f=q;
  }
  return f;
}
function atRedLight(A,B,rest){
  if(B.light<0)return false;
  if(rest>24||rest<5)return false;          // спира само на стоп-линията, не в кръстовището
  return !lightGreen(B,Math.abs(B.y-A.y)>Math.abs(B.x-A.x));
}
function sleepers(){var n=0;for(var i=0;i<cars.length;i++)if(cars[i].asleep)n++;return n;}
function wake(c,auto){
  c.asleep=false;c.sleepT=0;c.wait=0.2;
  if(auto){
    var f=Math.min(S.money,avgFare()*0.35);S.money-=f;
    parts.push({txt:"−"+money(f),red:true,x:c.x,y:c.y,z:34,vx:0,vy:0,vz:30,r:0,vr:0,t:1.4});
    say(c.x,c.y,"Ох, заспах…");
  }else{
    say(c.x,c.y,pick(["Буден съм!","Тръгвам!","Извинявай!"]));
    burst(c.x,c.y,"#FFD23F",6);
  }
}
function drive(c,dt,broke){
  var fl=fleets[c.f];
  if(c.brake>0)c.brake-=dt;
  if(c.asleep){
    c.sleepT+=dt;c.zz=(c.zz||0)+dt;
    if(c.sleepT>45)wake(c,true);
    return;
  }
  if(c.state==="washing"){
    c.washT-=dt;
    if(c.washT<=0){
      var fee=Math.min(S.money,washFee(fl));S.money-=fee;
      c.dirt=0;releaseBay(c);ST.wash++;
      parts.push({txt:"−"+money(fee),red:true,x:c.x,y:c.y,z:30,vx:0,vy:0,vz:28,r:0,vr:0,t:1.3});
      burst(c.x,c.y,"#7FD8F7",8);say(c.x,c.y,"Като нова!");
      c.state="idle";c.wait=0.3;c.idleT=0;c.path=[wash?wash.node:0];c.seg=0;c.t=0;
      c.x=nodes[c.path[0]].x;c.y=nodes[c.path[0]].y;
    }
    return;
  }
  if((c.state==="pickup"||c.state==="ride")&&sleepers()<2&&
     Math.random()<dt*(night>0.5?0.013:0.0045)/(1+0.09*totalCars())){
    c.asleep=true;c.sleepT=0;c.zz=0;c.brake=0.5;
    say(c.x,c.y,"Zzz…");
    return;
  }
  if(c.state==="parked"){
    if(fl.rest)return;
    var work=false;
    for(var w=0;w<clients.length;w++)if(!clients[w].taken){work=true;break;}
    if(work){releaseSlot(c);c.state="idle";c.wait=0;c.idleT=0;
      c.path=[depot?depot.node:0];c.seg=0;c.t=0;
      c.x=nodes[c.path[0]].x;c.y=nodes[c.path[0]].y;}
    return;
  }
  if(c.state==="idle"){
    c.wait-=dt;if(c.wait>0)return;
    if((c.dirt||0)>=0.75&&wash){
      if(sendToWash(c)){say(c.x,c.y,"Към мивката");return;}
    }
    var best=null,bd=1e9;
    if(!fl.rest)for(var i=0;i<clients.length;i++){var cl=clients[i];if(cl.taken)continue;
      var d=Math.hypot(nodes[cl.from].x-c.x,nodes[cl.from].y-c.y);if(d<bd){bd=d;best=cl;}}
    if(best){var p=route(c.path[c.seg]||c.path[0],best.from);
      if(p){best.taken=true;c.client=best;c.path=p;c.seg=0;c.t=0;c.state="pickup";c.idleT=0;}
      else{best.unreach=(best.unreach||0)+1;c.wait=1;}}
    else{
      c.idleT=(c.idleT||0)+0.6;c.wait=0.6;
      if(depot&&(fl.rest||c.idleT>6)){
        var pd=route(c.path[c.seg]||c.path[0],depot.node);
        if(pd&&pd.length>1){c.path=pd;c.seg=0;c.t=0;c.state="toDepot";}
        else if(pd){c.state="toDepot";c.path=pd;c.seg=0;c.t=0;arrive(c);}
      }
    }
    return;
  }
  var A=nodes[c.path[c.seg]],B=nodes[c.path[c.seg+1]];
  if(!B){arrive(c);return;}
  var len=Math.hypot(B.x-A.x,B.y-A.y),rest=(1-c.t)*len;
  var sp=(112+fl.lvl*3)*(Date.now()<turboUntil?2.2:1)
        *(isHwEdge(c.path[c.seg],c.path[c.seg+1])?1.5:1)*(broke?0.9:1)
        *(evOn()&&ev.k==="rain"?0.78:1)*carSpeed(c);   // дъждът бави, но вдига тарифата
  sp*=trafficFactor(c);
  if(atRedLight(A,B,rest)){sp=0;c.brake=0.4;}
  if(sp<=0.02){c.brake=Math.max(c.brake,0.2);c.stuck=(c.stuck||0)+dt;return;}
  c.stuck=0;
  c.t+=sp*dt/len;
  while(c.t>=1){c.t-=1;c.seg++;A=nodes[c.path[c.seg]];B=nodes[c.path[c.seg+1]];
    if(!B){arrive(c);return;}len=Math.hypot(B.x-A.x,B.y-A.y);c.brake=0.25;}
  var na=Math.atan2(B.y-A.y,B.x-A.x),d2=((na-c.a+Math.PI*3)%(Math.PI*2))-Math.PI;
  c.a+=d2*Math.min(1,dt*12);
  c.steer=(c.steer||0)*0.85+Math.max(-0.5,Math.min(0.5,d2))*0.15;
  c.x=A.x+(B.x-A.x)*c.t-Math.sin(c.a)*7;
  c.y=A.y+(B.y-A.y)*c.t+Math.cos(c.a)*7;
}
function driveNpc(n,dt){
  var A=nodes[n.path[n.seg]],B=nodes[n.path[n.seg+1]];
  if(!B){ var to=ri(0,nodes.length-1),p=route(n.path[n.seg],to);
    if(p&&p.length>1){n.path=p;n.seg=0;n.t=0;} else {n.path=[ri(0,nodes.length-1)];n.seg=0;}
    return; }
  var len=Math.hypot(B.x-A.x,B.y-A.y),rest=(1-n.t)*len;
  if(n.brake>0)n.brake-=dt;
  var sp=n.sp*(isHwEdge(n.path[n.seg],n.path[n.seg+1])?1.4:1)*trafficFactor(n);
  if(atRedLight(A,B,rest)){sp=0;n.brake=0.4;}
  if(sp<=0.02){n.brake=Math.max(n.brake,0.2);n.stuck=(n.stuck||0)+dt;return;}
  n.stuck=0;
  n.t+=sp*dt/len;
  while(n.t>=1){n.t-=1;n.seg++;A=nodes[n.path[n.seg]];B=nodes[n.path[n.seg+1]];
    if(!B)return;len=Math.hypot(B.x-A.x,B.y-A.y);n.brake=0.25;}
  var na=Math.atan2(B.y-A.y,B.x-A.x),d=((na-n.a+Math.PI*3)%(Math.PI*2))-Math.PI;
  n.a+=d*Math.min(1,dt*10);
  n.steer=(n.steer||0)*0.85+Math.max(-0.5,Math.min(0.5,d))*0.15;
  n.x=A.x+(B.x-A.x)*n.t-Math.sin(n.a)*7;
  n.y=A.y+(B.y-A.y)*n.t+Math.cos(n.a)*7;
}
function arrive(c){
  var last=c.path[c.path.length-1];c.x=nodes[last].x;c.y=nodes[last].y;
  if(c.state==="toWash"){
    var bay=freeBay(c);
    c.state="washing";c.washT=5;c.path=[last];c.seg=0;c.t=0;
    if(bay){c.x=bay.x;c.y=bay.y;c.a=Math.PI/2;}
    return;
  }
  if(c.state==="toDepot"){
    var sl=freeSlot(c);
    c.state="parked";c.path=[last];c.seg=0;c.t=0;c.idleT=0;
    if(sl){c.x=sl.x;c.y=sl.y;c.a=sl.a;}
    return;
  }
  if(c.state==="pickup"){
    var p=route(last,c.client.to);
    if(p){c.path=p;c.seg=0;c.t=0;c.state="ride";c.dist=pathLen(p);
      if(c.client.vip)questProgress("vip",1);
      say(c.x,c.y,pick(["Здрасти!","Към центъра","Бързаме!"]));}
    else{c.client.taken=false;c.client=null;c.state="idle";c.wait=.5;}
  }else{
    var fl=fleets[c.f],vip=c.client&&c.client.vip;
    c.dirt=Math.min(1,(c.dirt||0)+(0.09+c.dist/16000)*carDirtF(c));
    var mult=(vip?3:1)*(1+0.3*night)*evMult()*(1-0.30*c.dirt)*carFare(c);
    var pay=perKm(fl)*(c.dist/70)*mult;
    var tr=trait(c);
    if(tr.tip&&Math.random()<tr.tip){pay*=1.5;say(c.x,c.y,drvName(c)+": бакшиш!");}
    S.money+=pay;S.best+=pay;PR.tot+=pay;
    questProgress("rides",1);questProgress("earn",pay);
    ST.rides++;ST.km+=c.dist/70;if(vip)ST.vip++;if(night>0.5)ST.night++;
    sfx(vip?"gem":"cash");if(vip)vibro(18);
    if(night>0.5)questProgress("night",1);
    if(evOn())questProgress("rush",1);
    if(quest&&quest.type==="spot"&&c.client&&c.client.spot===quest.spot)questProgress("spot",1);
    if(quest&&quest.type==="long"&&c.dist>=quest.dist)questProgress("long",1);
    parts.push({txt:money(pay),x:c.x,y:c.y,z:30,vx:0,vy:0,vz:34,r:0,vr:0,t:1.5});
    burst(c.x,c.y,"#7BD08A",vip?16:8);
    if(vip){say(c.x,c.y,"Страхотен курс!");if(Math.random()<0.5)S.gems++;}
    else if(Math.random()<0.25)say(c.x,c.y,pick(["Мерси!","Супер!","5 звезди"]));
    var i=clients.indexOf(c.client);if(i>=0)clients.splice(i,1);
    c.client=null;c.state="idle";c.wait=rnd(.2,.8);c.path=[last];c.seg=0;
  }
}

/* ==================== звук ==================== */
/* Всичко се синтезира през WebAudio — нито един байт активи, което пази
   еднофайловата структура. Контекстът се създава лениво, защото браузърите
   не позволяват звук преди първо докосване. */
var AC=null,lastCash=0;
function ac(){
  if(AC===null){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}}
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}
  return AC||null;
}
function beep(freq,dur,type,vol,slide){
  var c=ac();if(!c)return;
  try{
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type=type||"square";o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol||0.10,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}

  ctx.setLineDash([26,40]);ctx.stroke();ctx.setLineDash([]);

    ctx.fillStyle=rgbs(mixHex("#BEE0A6","#16271D",night));rr(b.x,b.y,b.w,b.h,12);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,"+(0.35*(1-night))+")";ctx.lineWidth=3;ctx.setLineDash([7,9]);
    ctx.beginPath();ctx.moveTo(b.x+8,b.y+b.h*0.6);ctx.lineTo(b.x+b.w-8,b.y+b.h*0.35);ctx.stroke();ctx.setLineDash([]);});
  ponds.forEach(function(p){ctx.fillStyle=rgbs(mixHex("#8FCCEC","#0E1A36",night));
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.w/2,p.h/2,0,0,7);ctx.fill();});

  // улици
  drawRoads(v);

  // маршрути
  ctx.setLineDash([12,12]);ctx.lineWidth=4;
  ctx.strokeStyle=night>0.4?"rgba(255,214,80,.95)":"rgba(240,180,20,.85)";
  cars.forEach(function(c){if(c.state==="idle")return;
    ctx.beginPath();ctx.moveTo(c.x,c.y);
    for(var s=c.seg+1;s<c.path.length;s++)ctx.lineTo(nodes[c.path[s]].x,nodes[c.path[s]].y);
    ctx.stroke();});

function sellCar(fl){
  var idx=fleets.indexOf(fl);
  if(fl.cars<=1)return;
  var best=-1,rank=9;
  for(var i=0;i<cars.length;i++){
    if(cars[i].f!==idx)continue;
    var r=cars[i].state==="parked"?0:cars[i].state==="idle"?1:cars[i].state==="toDepot"?2:3;
    if(r<rank){rank=r;best=i;}
  }
  if(best<0)return;
  var c=cars[best];
  if(c.client){c.client.taken=false;}
  releaseSlot(c);releaseBay(c);     // иначе боксът остава зает завинаги
  cars.splice(best,1);
  fl.cars--;
  var p=sellPrice(fl);S.money+=p;
  popupSmall("Продадена кола +"+money(p));
  save();updCards();
}
function updCards(){
  if(cityCard&&CITIES[cityIdx+1]){
    var nx=CITIES[cityIdx+1],C=cityCard._r,ready=nextCityReady();
    setHid(C.myst,ready);setHid(C.real,!ready);
    if(ready){
      setTxt(C.nm,nx.name);
      setTxt(C.goS,money(nx.price));
      setCls(C.go,"go"+(S.money>=nx.price?"":" cant"));
    }else{
      var o=zonesOpen(),t=ZONES.length;
      setTxt(C.nm,"?");
      setTxt(C.hint,"Отключи всички райони"+String.fromCharCode(10)+o+" / "+t);
      var w=Math.round(o/t*100)+"%";
      if(C.bar._w!==w){C.bar._w=w;C.bar.style.width=w;}
    }
  }
  for(var i=0;i<fleets.length&&i<cardEls.length;i++){
    var fl=fleets[i],R=cardEls[i]._r,uc=upCost(fl),cc=carCost(fl);
    setTxt(R.lvn,fl.lvl+"");
    setTxt(R.pm,money(perKm(fl)));
    setTxt(R.cn,fl.cars+" бр.");
    setTxt(R.ex,money(fl.cars*carUpkeep(fl)));
    var dsum=0,dn=0;
    for(var y=0;y<cars.length;y++)if(cars[y].f===i){dsum+=cars[y].dirt||0;dn++;}
    setTxt(R.dt,Math.round((dn?dsum/dn:0)*100)+"%");
    var fm=fleetMult(fl),nx2=nextMile(fl),need=nx2-fl.cars;
    setTxt(R.mv,"×"+fm);
    setTxt(R.mn,nx2?("още "+need+(need===1?" кола":" коли")+" → ×"+(fm*2)):"пълен бонус");
    var st=Math.min(5,Math.ceil(fl.lvl/6)),s="";
    for(var k=0;k<5;k++)s+=k<st?"<i>★</i>":"★";
    if(R.stars._h!==s){R.stars._h=s;R.stars.innerHTML=s;}
    setTxt(R.upS,money(uc));
    setCls(R.up,"up"+(S.money<uc?" cant":""));
    var full=fl.cars>=MAXCARS;
    setTxt(R.carS,full?"пълен":money(cc));
    setCls(R.car,"car"+((full||S.money<cc)?" cant":""));
    setTxt(R.sellS,fl.cars>1?"+"+money(sellPrice(fl)):"–");
    setCls(R.sell,"sell"+(fl.cars>1?"":" cant"));
    var parked=0;for(var z=0;z<cars.length;z++)if(cars[z].f===i&&cars[z].state==="parked")parked++;
    setTxt(R.rest,fl.rest?("В гаража ("+parked+")"):"Прибери");
    setCls(R.rest,fl.rest?"rest on":"rest");
  }
}

function achHTML(){

  for(var i=0;i<ACHS.length;i++){
    var a=ACHS[i],on=!!ACH[a.k];
    h+='<div class="prow"><div class="lb" style="'+(on?'':'opacity:.5')+'">'+
       (on?'✓ ':'')+a.n+'<small>'+a.d+'</small></div>'+
       '<div class="vl" style="color:'+(on?'#1FA871':'#7C8399')+'">+'+Math.round(a.b*100)+'%</div></div>';
  }

function drvHTML(){
  var h="";
  for(var i=0;i<fleets.length;i++){
    var mine=cars.filter(function(c){return c.f===i;});
    if(!mine.length)continue;
    h+='<div class="phead">'+fleets[i].name+' · '+mine.length+
       (mine.length===1?' кола':' коли')+'</div>';
    mine.forEach(function(c){
      var t=trait(c);
      h+='<div class="prow"><div class="lb">'+drvName(c)+'<small>'+t.d+'</small></div>'+
         '<div class="vl" style="font-size:12px;color:#2E9BD6">'+t.n+'</div></div>';
    });
  }
  return h||'<div class="phead">Още няма коли</div>';
}

       '<button class="pbtn'+(can?'':' cant')+'" data-buy="'+it.k+'" style="width:auto;min-width:76px">'+
       it.c+' 💎</button></div>';

function renderPanel(){

    x.className=x.getAttribute("data-tab")===PTAB?"on":"";});
  b.innerHTML=PTAB==="stat"?statHTML():PTAB==="ach"?achHTML():
              PTAB==="drv"?drvHTML():PTAB==="shop"?shopHTML():setHTML();
  [].forEach.call(b.querySelectorAll("[data-buy]"),function(x){
    x.onclick=function(){shopBuy(x.getAttribute("data-buy"));};});
  [].forEach.call(b.querySelectorAll("[data-tgl]"),function(x){
    x.onclick=function(){var k=x.getAttribute("data-tgl");SET[k]=SET[k]?0:1;
      if(k==="sound"&&SET.sound)sfx("tap");save();renderPanel();};});
  [].forEach.call(b.querySelectorAll("[data-act]"),function(x){
    x.onclick=function(){var a=x.getAttribute("data-act");
      if(a==="pres")askPrestige(); else if(a==="reset")askNewGame();};});
}

/* ---- престиж ---- */
function askPrestige(){
  var g=presAvail();if(g<1)return;
  document.getElementById("mT").textContent="Да продадеш ли империята?";
  document.getElementById("mP").innerHTML=
    "Връщаш се в първия град с една фирма. Пазиш диамантите, постиженията и статистиката."+
    "<span class='big'>+"+g+" точки</span>Всяка точка дава +25% приход завинаги.";
  var ok=document.getElementById("mB"),no=document.getElementById("mC");
  ok.textContent="Продай";ok.disabled=false;no.classList.remove("hidden");
  document.getElementById("modal").classList.remove("hidden");
  ok.onclick=function(){
    PR.pp+=g;PR.runs++;
    S.money=900;S.best=0;fleets=[];cars=[];cityIdx=0;
    loadCity(null);addFleet(0);syncCars();buildCards();newQuest();
    achCheck();save();
    document.getElementById("modal").classList.add("hidden");no.classList.add("hidden");
    closePanel();
    popup("Нова империя","Започваш отначало, но по-силен."+
      "<span class='big'>×"+(Math.round(presMult()*100)/100)+"</span>приход от престиж");
    sfx("big");vibro([20,70,20]);
  };
  no.onclick=function(){document.getElementById("modal").classList.add("hidden");
    no.classList.add("hidden");ok.onclick=null;ok.textContent="Продължи";};
}

/* ==================== запис ==================== */
/* Записът работи навсякъде: localStorage, после IndexedDB, после в паметта. */
var LS=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return localStorage;}catch(e){return null;}})();
var IDB=null,memStore={};
/* Отварянето на базата е асинхронно — всяко четене/писане го изчаква,
   иначе първият достъп заварва IDB===null и резервният запис е безполезен. */
var idbReady=new Promise(function(res){
  try{
    var rq=indexedDB.open("taxi-empire",1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore("kv");};
    rq.onsuccess=function(){IDB=rq.result;res();};
    rq.onerror=function(){res();};
    rq.onblocked=function(){res();};
  }catch(e){res();}
  setTimeout(res,1500);          // предпазна мрежа, ако базата не отговори
});
function idbPut(k,v){
  idbReady.then(function(){
    if(!IDB)return;
    try{IDB.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}
  });
}
function idbGet(k){
  return idbReady.then(function(){
    return new Promise(function(res){
      if(!IDB){res(null);return;}
      try{var r=IDB.transaction("kv","readonly").objectStore("kv").get(k);
        r.onsuccess=function(){res(r.result||null);};r.onerror=function(){res(null);};
      }catch(e){res(null);}
    });
  });
}
var store={
  set:function(k,v){
    memStore[k]=v;
    if(LS){try{LS.setItem(k,v);}catch(e){}}
    idbPut(k,v);
    if(typeof window.storage!=="undefined"&&window.storage&&window.storage.set){
      try{window.storage.set(k,v);}catch(e){}
    }
  },
  get:function(k){
    if(LS){var v=null;try{v=LS.getItem(k);}catch(e){}
      if(v)return Promise.resolve({value:v});}
    if(memStore[k])return Promise.resolve({value:memStore[k]});
    return idbGet(k).then(function(v){return v?{value:v}:null;});
  },
  clear:function(k,done){
    delete memStore[k];
    if(LS){try{LS.removeItem(k);}catch(e){}}
    if(typeof window.storage!=="undefined"&&window.storage&&window.storage.delete){
      try{window.storage.delete(k);}catch(e){}
    }
    var fired=false;
    function fin(){if(!fired){fired=true;if(done)done();}}
    idbReady.then(function(){
      if(!IDB){fin();return;}
      try{
        var tx=IDB.transaction("kv","readwrite");
        tx.objectStore("kv").delete(k);
        tx.oncomplete=fin;tx.onerror=fin;tx.onabort=fin;
      }catch(e){fin();}
    });
    setTimeout(fin,600);   // предпазна мрежа
  }
};
var SAVEKEY="taxi-empire-save",resetSave=false;
function rate(){if(hist.length<2)return 0;var a=hist[0],b=hist[hist.length-1],d=(b.t-a.t)/1000;return d>1?(b.m-a.m)/d:0;}
function save(){if(!store||resetSave)return;
  try{store.set(SAVEKEY,JSON.stringify({m:S.money,b:S.best,g:S.gems,ck:clock,ci:cityIdx,
    fl:fleets.map(function(f,i){
      var ds=0,dn=0;
      for(var k=0;k<cars.length;k++)if(cars[k].f===i){ds+=cars[k].dirt||0;dn++;}
      var dr=[];
      for(var q=0;q<cars.length;q++)if(cars[q].f===i)dr.push([cars[q].dn|0,cars[q].dt|0]);
      return{i:f.idx,l:f.lvl,c:f.cars,r:f.rest?1:0,d:dn?Math.round(ds/dn*100)/100:0,dr:dr};
    }),
    zn:ZONES.map(function(z){return z.open?1:0;}),r:Math.max(0,rate()-expenseRate()),t:Date.now(),
    se:SET,st:ST,pr:PR,dy:DY,tu:TUT,gb:gemBuff,ac:Object.keys(ACH)}));}catch(e){}}
var hiddenAt=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){save();hiddenAt=Date.now();}
  else if(hiddenAt){
    var away=Math.min((Date.now()-hiddenAt)/1000,4*3600);
    hiddenAt=0;
    checkDaily();
    if(away>60){
      var off=Math.max(0,rate()-expenseRate())*away*0.5;
      if(off>1){S.money+=off;
        popup("Докато те нямаше","Колите работиха "+Math.round(away/60)+" мин.<span class='big'>"+money(off)+"</span>");}
    }
  }
});
window.addEventListener("pagehide",function(){save();});
/* ==================== старт ==================== */
function loadCity(keepZones){
  CITY=CITIES[cityIdx];
  genCity();buildZones(keepZones);
  blocked={};accidents=[];clients=[];crates=[];parts=[];bubbles=[];npcs=[];
  spawnNpcs(CITY.npc);
  cars.forEach(function(c){
    var n=randomOpenNode();
    releaseSlot(c);releaseBay(c);
    c.path=[n];c.seg=0;c.t=0;c.x=nodes[n].x;c.y=nodes[n].y;
    c.state="idle";c.client=null;c.wait=rnd(0,1);c.asleep=false;c.idleT=0;
  });
  resize(true);
  camT.x=cam.x=DOWNS[0].x;camT.y=cam.y=DOWNS[0].y;clampT();
  document.getElementById("cityTag").firstChild.nodeValue=CITY.name;
  for(var i=0;i<6;i++)spawnClient();
}
function zonesOpen(){var k=0;for(var i=0;i<ZONES.length;i++)if(ZONES[i].open)k++;return k;}
function cityTeaser(){
  var o=zonesOpen(),t=ZONES.length,left=t-o;
  popup("Нов град?","Следващият град се отваря, след като развиеш този докрай."+
    "<span class='big'>"+o+" / "+t+"</span>"+
    (left?("Докосни заключен район на картата, за да го купиш. "+
           (left===1?"Остава 1 район.":"Остават "+left+" района.")):
          "Всички райони са твои — вече можеш да се местиш."));
}
function nextCityReady(){
  if(cityIdx>=CITIES.length-1)return false;
  for(var i=0;i<ZONES.length;i++)if(!ZONES[i].open)return false;
  return true;
}
function moveCity(){
  if(!nextCityReady())return;
  var price=CITIES[cityIdx+1].price;
  if(S.money<price)return;
  S.money-=price;cityIdx++;
  loadCity(null);buildCards();save();
  popup("Нов град","Отваряш клон в "+CITY.name+
    ".<span class='big'>тарифи ×"+CITY.mult+"</span>По-голяма карта, повече трафик и по-високи разходи.");
}
genCity();buildZones();resize(true);spawnNpcs(CITY.npc);
function boot(d){
  if(d){
    S.money=d.m||0;S.best=d.b||0;S.gems=d.g||0;clock=d.ck||clock;
    if(d.se){SET.sound=d.se.sound?1:0;SET.vibro=d.se.vibro?1:0;}
    if(d.st)for(var sk in ST)if(typeof d.st[sk]==="number")ST[sk]=d.st[sk];
    if(d.pr){PR.pp=d.pr.pp||0;PR.tot=d.pr.tot||0;PR.runs=d.pr.runs||0;}
    if(d.dy){DY.last=d.dy.last||0;DY.streak=d.dy.streak||0;}
    if(d.tu)TUT=d.tu;
    gemBuff=d.gb||0;
    (d.ac||[]).forEach(function(k){ACH[k]=1;});
    if(typeof d.ci==="number"&&CITIES[d.ci]){cityIdx=d.ci;CITY=CITIES[cityIdx];genCity();buildZones();resize(true);npcs=[];spawnNpcs(CITY.npc);
      camT.x=cam.x=DOWNS[0].x;camT.y=cam.y=DOWNS[0].y;clampT();
      document.getElementById("cityTag").firstChild.nodeValue=CITY.name;}
    (d.zn||[]).forEach(function(v,i){if(ZONES[i])ZONES[i].open=!!v||i===0;});
    (d.fl||[]).forEach(function(f){addFleet(f.i);var Lf=fleets[fleets.length-1];Lf.lvl=f.l||1;Lf.cars=f.c||1;Lf.rest=!!f.r;Lf._d=f.d||0;});
    var away=Math.min((Date.now()-d.t)/1000,4*3600),off=(d.r||0)*away*0.55;
    if(away>120&&off>1){S.money+=off;
      popup("Докато те нямаше","Приход минус разходи за "+Math.round(away/60)+" мин.<span class='big'>"+money(off)+"</span>");}
  }
  lastDay=Math.floor(clock/DAY);
  if(!fleets.length)addFleet(0);
  if(!PR.tot)PR.tot=S.best;          // записи отпреди престижа
  syncCars();
  cars.forEach(function(c){var f=fleets[c.f];if(f&&f._d)c.dirt=f._d;});
  fleets.forEach(function(f){delete f._d;});
  // шофьорите се връщат по реда, в който са били записани; по-стар запис
  // просто няма полето и колите пазят случайните си шофьори
  if(d)(d.fl||[]).forEach(function(sf,fi){
    var dr=sf.dr||[],k=0;
    for(var c=0;c<cars.length;c++)if(cars[c].f===fi&&k<dr.length){
      cars[c].dn=dr[k][0]|0;cars[c].dt=dr[k][1]|0;k++;}
  });
  buildCards();newQuest();
  for(var i=0;i<6;i++)spawnClient();
  if(!d)DY.last=dayKey(Date.now());   // ден 1 идва утре, днес говори обучението
  tutorial();checkDaily();achCheck();
  var last=performance.now(),errN=0;
  // кадърът се презаписва пръв: грешка в update/draw не спира играта завинаги
  (function loop(now){
    requestAnimationFrame(loop);
    var dt=Math.min((now-last)/1000,0.08);last=now;
    try{update(dt);draw();}
    catch(e){if(errN++<5&&window.console&&console.error)console.error("кадър:",e);}
  })(last);
}
store.get(SAVEKEY).then(function(r){var d=null;try{d=r?JSON.parse(r.value):null;}catch(e){}boot(d);}).catch(function(){boot(null);});
})();
</script>
